<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="Henry Chea, independent developer building side projects in Phnom Penh. Formerly SDK and platform work at IDVerse, GVRN.ai, Tab Next Asia, and SpeakTe.">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1b1b1d" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0"/>
      <stop offset="40%" stop-color="#facc15" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#ef4444" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="360" fill="#0e0e10"/>
  <rect width="1000" height="360" fill="url(#grid)"/>

  <!-- frame -->
  <rect x="32" y="24" width="936" height="312" fill="#131315" stroke="#facc15" stroke-width="1.5"/>
  <rect x="44" y="36" width="912" height="288" fill="none" stroke="#4d4632" stroke-width="1" opacity="0.7"/>
  <path d="M 32 56 L 32 24 L 64 24" fill="none" stroke="#ef4444" stroke-width="3"/>
  <path d="M 968 56 L 968 24 L 936 24" fill="none" stroke="#ef4444" stroke-width="3"/>
  <path d="M 32 304 L 32 336 L 64 336" fill="none" stroke="#ef4444" stroke-width="3"/>
  <path d="M 968 304 L 968 336 L 936 336" fill="none" stroke="#ef4444" stroke-width="3"/>
  <rect x="32" y="24" width="936" height="3" fill="url(#scan)"/>

  <!-- header -->
  <rect x="60" y="52" width="8" height="8" fill="#facc15"/>
  <text x="76" y="60" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#9a9078">SYS.PROFILE // HENRY_CHEA</text>
  <text x="940" y="60" text-anchor="end" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#facc15">[INDEPENDENT]</text>

  <!-- left -->
  <text x="68" y="136" font-family="'Space Grotesk', -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="700" letter-spacing="1" fill="#e5e1e4">HENRY CHEA</text>
  <text x="68" y="178" font-family="'Space Grotesk', -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" letter-spacing="2" fill="#facc15">INDEPENDENT DEVELOPER</text>
  <text x="68" y="206" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.5" letter-spacing="0.5" fill="#9a9078">building my own products · local-first · open source</text>

  <!-- chips -->
  <g font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4">
    <rect x="68" y="228" width="150" height="28" fill="#131315" stroke="#4d4632"/>
    <text x="80" y="246" fill="#e5e1e4">PHNOM PENH, KH</text>
    <rect x="226" y="228" width="82" height="28" fill="#131315" stroke="#4d4632"/>
    <text x="238" y="246" fill="#e5e1e4">REMOTE</text>
    <rect x="316" y="228" width="96" height="28" fill="#131315" stroke="#facc15" stroke-opacity="0.55"/>
    <text x="328" y="246" fill="#facc15">MIT / OSS</text>
  </g>

  <text x="68" y="300" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.2" fill="#6f6a5a">FORMERLY  IDVERSE · GVRN.AI · TAB NEXT ASIA · SPEAKTE</text>

  <!-- terminal -->
  <rect x="588" y="80" width="340" height="212" fill="#0e0e10" stroke="#4d4632"/>
  <rect x="588" y="80" width="340" height="26" fill="#1b1b1d" stroke="#4d4632"/>
  <rect x="600" y="89" width="8" height="8" fill="#ef4444"/>
  <rect x="614" y="89" width="8" height="8" fill="#facc15"/>
  <rect x="628" y="89" width="8" height="8" fill="#4d4632"/>
  <text x="650" y="97" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.2" fill="#9a9078">bash // henry</text>

  <g font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" letter-spacing="0.3">
    <text x="604" y="128" fill="#9a9078">$ <tspan fill="#e5e1e4">whoami</tspan></text>
    <text x="604" y="148" fill="#e5e1e4">henry chea</text>
    <text x="604" y="172" fill="#9a9078">$ <tspan fill="#e5e1e4">status</tspan></text>
    <text x="604" y="192" fill="#facc15">independent · side projects</text>
    <text x="604" y="216" fill="#9a9078">$ <tspan fill="#e5e1e4">now</tspan></text>
    <text x="604" y="236" fill="#e5e1e4">sunnygen · v2.0.0 · MIT</text>
    <text x="604" y="260" fill="#9a9078">$ <tspan fill="#e5e1e4">open_to</tspan></text>
    <text x="604" y="280" fill="#facc15">the right conversations</text>
  </g>

  <rect x="32" y="333" width="936" height="3" fill="url(#scan)"/>
</svg>
